syntax = "proto3";

package unison.wire.v1;

option go_package = "github.com/lebe-dev/unison/proto/unison/wire/v1;wirev1";

import "unison/wire/v1/types.proto";

// Availability of a blob on a peer.
message HaveBlob {
  // BLAKE3 hash of the blob, 32 bytes.
  bytes hash = 1;
}

// Answer to a blob availability query.
message HaveBlobResp {
  // BLAKE3 hash of the blob, 32 bytes.
  bytes hash = 1;
  bool have = 2;
  // Number of chunks the peer stores.
  uint32 chunks = 3;
}

// Request for a chunk range of a blob.
message BlobRequest {
  // BLAKE3 hash of the blob, 32 bytes.
  bytes hash = 1;
  uint32 from_chunk = 2;
  // Inclusive bound, zero means the last chunk.
  uint32 to_chunk = 3;
}

// One chunk of a blob payload.
message BlobChunk {
  uint32 index = 1;
  bytes data = 2;
  // BLAKE3 hash of the chunk, 32 bytes.
  bytes chunk_hash = 3;
}

// Offer to transfer files.
message ShareOffer {
  string transfer_id = 1;
  repeated FileMeta files = 2;
}

// Answer to a share offer.
message ShareDecision {
  string transfer_id = 1;
  bool accepted = 2;
}
