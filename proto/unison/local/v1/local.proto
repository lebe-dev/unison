syntax = "proto3";

package unison.local.v1;

option go_package = "github.com/lebe-dev/unison/proto/unison/local/v1;localv1";

// Role of a paired device.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_PERSONAL = 1;
  ROLE_FRIENDS = 2;
}

// Operating system of a device.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_MACOS = 1;
  PLATFORM_WINDOWS = 2;
  PLATFORM_ANDROID = 3;
}

// Network path to a device.
enum Path {
  PATH_UNSPECIFIED = 0;
  PATH_LAN = 1;
  PATH_RELAY = 2;
}

// Content kind of a clip item.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_TEXT = 1;
  KIND_IMAGE = 2;
  KIND_FILES = 3;
}

// Where a clip item was captured.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_CLIPBOARD = 1;
  SOURCE_SHARE = 2;
  SOURCE_CLI = 3;
}

// Kind of a daemon event.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // A session with a paired device is open.
  EVENT_KIND_PEER_ONLINE = 1;
  // The session with a paired device ended.
  EVENT_KIND_PEER_OFFLINE = 2;
  // A clipboard item was captured or applied.
  EVENT_KIND_CLIPBOARD = 3;
  // A peer speaks another protocol version and has to be updated.
  EVENT_KIND_PEER_INCOMPATIBLE = 4;
  // A device that is open for pairing was discovered.
  EVENT_KIND_PAIRING_CANDIDATE = 5;
  // A device asked to pair. The SAS is ready and the user decides.
  EVENT_KIND_PAIRING_REQUEST = 6;
  // A pairing exchange completed.
  EVENT_KIND_PAIRING_PAIRED = 7;
  // A pairing exchange ended without a new device.
  EVENT_KIND_PAIRING_FAILED = 8;
  // The pairing window closed.
  EVENT_KIND_PAIRING_CLOSED = 9;
  // A clipboard item is kept in the history until the user downloads it.
  EVENT_KIND_CLIP_DOWNLOAD = 10;
  // A clipboard item waits for the user to apply it.
  EVENT_KIND_CLIP_APPLY = 11;
  // A file transfer changed its state or made progress.
  EVENT_KIND_TRANSFER = 12;
}

// Pause mode requested by the client.
enum PauseMode {
  PAUSE_MODE_UNSPECIFIED = 0;
  // Resume the clipboard synchronization.
  PAUSE_MODE_OFF = 1;
  // Pause until the client resumes it.
  PAUSE_MODE_INDEFINITE = 2;
  // Pause until until_unix_ms.
  PAUSE_MODE_UNTIL = 3;
}

// Direction of a file transfer.
enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  TRANSFER_DIRECTION_OUTGOING = 1;
  TRANSFER_DIRECTION_INCOMING = 2;
}

// State of a file transfer.
enum TransferState {
  TRANSFER_STATE_UNSPECIFIED = 0;
  // An incoming offer waits for AcceptTransfer or RejectTransfer.
  TRANSFER_STATE_PENDING = 1;
  // An outgoing offer is sent and the peer has not answered yet.
  TRANSFER_STATE_OFFERED = 2;
  TRANSFER_STATE_TRANSFERRING = 3;
  TRANSFER_STATE_DONE = 4;
  TRANSFER_STATE_DECLINED = 5;
  TRANSFER_STATE_CANCELED = 6;
  TRANSFER_STATE_FAILED = 7;
}

// How a pairing exchange was started.
enum PairingMethod {
  PAIRING_METHOD_UNSPECIFIED = 0;
  // Both devices compare a short authentication string.
  PAIRING_METHOD_SAS = 1;
  // One device scanned the code of the other one, so only that other device
  // asks its user.
  PAIRING_METHOD_QR = 2;
}

// Local API of the daemon, served over a unix socket or a named pipe.
service UnisonService {
  // Version and runtime state of the daemon.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Daemon events as they happen. The stream ends when the client disconnects
  // or the daemon stops.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);

  // Paired devices.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RenameDevice(RenameDeviceRequest) returns (RenameDeviceResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  rpc SetDeviceConfirmation(SetDeviceConfirmationRequest) returns (SetDeviceConfirmationResponse);
  // Address of a paired device, entered by the user. It is tried before the
  // discovered and cached ones, for networks where discovery does not work.
  rpc SetPeerAddress(SetPeerAddressRequest) returns (SetPeerAddressResponse);

  // Pairing window and the short authentication string of an exchange.
  rpc OpenPairingWindow(OpenPairingWindowRequest) returns (OpenPairingWindowResponse);
  rpc ExtendPairingWindow(ExtendPairingWindowRequest) returns (ExtendPairingWindowResponse);
  rpc ClosePairingWindow(ClosePairingWindowRequest) returns (ClosePairingWindowResponse);
  rpc ListPairingCandidates(ListPairingCandidatesRequest) returns (ListPairingCandidatesResponse);
  rpc StartSas(StartSasRequest) returns (StartSasResponse);
  rpc ConfirmSas(ConfirmSasRequest) returns (ConfirmSasResponse);
  rpc RejectSas(RejectSasRequest) returns (RejectSasResponse);
  // Pairing code of the open window, for the device that shows it.
  rpc GetPairingQr(GetPairingQrRequest) returns (GetPairingQrResponse);
  // Pair with the device of a pairing code, for the device that scans it.
  rpc ScanPairingQr(ScanPairingQrRequest) returns (ScanPairingQrResponse);

  // Clipboard.
  rpc GetClip(GetClipRequest) returns (GetClipResponse);
  // Copy local text to the clipboard and announce it to the peers.
  rpc SetClip(SetClipRequest) returns (SetClipResponse);

  // History of clip items.
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);
  rpc GetHistoryItem(GetHistoryItemRequest) returns (GetHistoryItemResponse);
  rpc DeleteHistoryItem(DeleteHistoryItemRequest) returns (DeleteHistoryItemResponse);
  // Download the payloads of an item. They are written to path when it is set.
  rpc FetchHistoryItem(FetchHistoryItemRequest) returns (FetchHistoryItemResponse);
  // Copy an item back to the local clipboard.
  rpc CopyHistoryItem(CopyHistoryItemRequest) returns (CopyHistoryItemResponse);
  // Apply an item that waits for confirmation to the local clipboard.
  rpc ApplyHistoryItem(ApplyHistoryItemRequest) returns (ApplyHistoryItemResponse);

  // File transfers with the paired devices.
  rpc SendFiles(SendFilesRequest) returns (SendFilesResponse);
  rpc ListTransfers(ListTransfersRequest) returns (ListTransfersResponse);
  rpc CancelTransfer(CancelTransferRequest) returns (CancelTransferResponse);
  // Accept an incoming offer that waits for a decision.
  rpc AcceptTransfer(AcceptTransferRequest) returns (AcceptTransferResponse);
  // Reject an incoming offer that waits for a decision.
  rpc RejectTransfer(RejectTransferRequest) returns (RejectTransferResponse);

  // Temporary search for Friends devices. Both devices of a pair turn it on
  // for the devices to find each other.
  rpc SetFriendsDiscovery(SetFriendsDiscoveryRequest) returns (SetFriendsDiscoveryResponse);

  // Incoming file transfer requests that wait for a decision.
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse);
  // Accept or decline a request and tell the sender.
  rpc DecideRequest(DecideRequestRequest) returns (DecideRequestResponse);

  // Pause of the clipboard synchronization.
  rpc GetPause(GetPauseRequest) returns (GetPauseResponse);
  rpc SetPause(SetPauseRequest) returns (SetPauseResponse);

  // Settings of the daemon.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);

  // Relay access of the Personal group and the state of its client.
  rpc GetRelay(GetRelayRequest) returns (GetRelayResponse);
  // Store the relay access of the group. The other Personal devices receive it
  // with the group data.
  rpc SetRelay(SetRelayRequest) returns (SetRelayResponse);
  // Turn the relay off for the whole group.
  rpc RelayOff(RelayOffRequest) returns (RelayOffResponse);
}

// Network conditions of the local device.
message NetworkState {
  bool online = 1;
  bool wifi = 2;
  bool cellular = 3;
  bool metered = 4;
  bool roaming = 5;
  bool vpn = 6;
  bool data_saver = 7;
}

// A paired device.
message Device {
  // Device ID in lowercase hex.
  string device_id = 1;
  string name = 2;
  Role role = 3;
  Platform platform = 4;
  bool online = 5;
  Path path = 6;
  bool require_confirmation = 7;
  bool revoked = 8;
  // Time the device was added, unix milliseconds.
  int64 added_at_unix_ms = 9;
  // Time the device was last reachable, unix milliseconds.
  int64 last_seen_at_unix_ms = 10;
}

// State of the clipboard pause.
// Temporary search for Friends devices.
message FriendsDiscovery {
  // The device looks for Friends devices.
  bool on = 1;
  // End of the search, unix milliseconds. Zero when it is off.
  int64 until_unix_ms = 2;
}

message Pause {
  bool paused = 1;
  // The pause has no deadline and lasts until it is turned off.
  bool indefinite = 2;
  // Deadline of a pause, unix milliseconds. Zero for an indefinite pause.
  int64 until_unix_ms = 3;
}

// One representation of a clip item payload.
message Representation {
  string mime_type = 1;
  // Payload size in bytes.
  uint64 size = 2;
  // BLAKE3 hash of the payload in lowercase hex, 32 bytes.
  string blake3 = 3;
  // Payload itself, set only for small payloads.
  bytes inline_bytes = 4;
  // File name, set for file representations.
  string file_name = 5;
  // File modification time, unix milliseconds.
  int64 mtime_unix_ms = 6;
}

// A clipboard history entry.
message ClipItem {
  // UUID of the item.
  string id = 1;
  // Device ID of the origin device in lowercase hex.
  string origin = 2;
  // Monotonic per-origin counter.
  uint64 seq = 3;
  // Capture time, unix milliseconds.
  int64 created_at_unix_ms = 4;
  // Expiry time set by the origin device, unix milliseconds.
  int64 expires_at_unix_ms = 5;
  Kind kind = 6;
  repeated Representation representations = 7;
  Source source = 8;
  // Tombstone of a manual deletion.
  bool deleted = 9;
}

// Short authentication string of a pairing exchange.
message Sas {
  // Six decimal digits.
  string digits = 1;
  // Four emoji.
  repeated string emoji = 2;
}

// An event of the daemon. The fields that apply depend on kind.
message Event {
  EventKind kind = 1;
  // Device ID of the device the event is about, lowercase hex.
  string device_id = 2;
  string name = 3;
  Role role = 4;
  Platform platform = 5;
  Path path = 6;
  // The clipboard item was captured on this device instead of arriving from a
  // peer.
  bool local = 7;
  // Clipboard item, set on EVENT_KIND_CLIPBOARD.
  ClipItem item = 8;
  // Address of a pairing candidate, set on EVENT_KIND_PAIRING_CANDIDATE.
  string addr = 9;
  // Set on the pairing events that show a SAS.
  Sas sas = 10;
  // Protocol version of the peer, set on EVENT_KIND_PEER_INCOMPATIBLE.
  uint32 protocol_version = 11;
  // Failure in plain English when the event reports one.
  string error = 12;
  // Time of the event, unix milliseconds.
  int64 at_unix_ms = 13;
  // File transfer, set on EVENT_KIND_TRANSFER.
  Transfer transfer = 14;
  // How the pairing exchange of the event was started.
  PairingMethod pairing_method = 15;
}

// State of the pairing window.
message PairingWindow {
  bool open = 1;
  // Address the window listens on, host:port.
  string addr = 2;
  // Time the window closes, unix milliseconds.
  int64 expires_at_unix_ms = 3;
}

// Code of a pairing window. It carries a one time token, so a client must not
// store it or put it into a log.
message PairingQr {
  // Text of the code.
  string uri = 1;
  // Time the window closes, unix milliseconds.
  int64 expires_at_unix_ms = 2;
}

// A device that is open for pairing.
message PairingCandidate {
  // Address to pass to StartSas, host:port.
  string addr = 1;
  // Service metadata of the candidate.
  map<string, string> txt = 2;
  // Time the candidate was discovered, unix milliseconds.
  int64 first_seen_unix_ms = 3;
}

// Outcome of one policy cell for an item that arrives without an explicit
// request.
enum PolicyAction {
  POLICY_ACTION_UNSPECIFIED = 0;
  // The item is dropped and not recorded.
  POLICY_ACTION_REJECT = 1;
  // The item is recorded and fetched on request.
  POLICY_ACTION_METADATA = 2;
  // The item is recorded and applied after a confirmation.
  POLICY_ACTION_CONFIRM = 3;
  // The item is applied without asking.
  POLICY_ACTION_AUTO = 4;
}

// Policy of one content kind under one network condition.
message PolicyCell {
  // Outcome for the item.
  optional PolicyAction action = 1;
  // Largest item fetched eagerly, in bytes.
  optional int64 max_size_bytes = 2;
}

// Policy of one network condition.
message PolicyRow {
  PolicyCell text = 1;
  PolicyCell image = 2;
  PolicyCell files = 3;
  // Whether the relay path may be used.
  optional bool relay = 4;
}

// Settings of the daemon.
message Settings {
  // Device name announced to peers. Applied at the next start.
  string device_name = 1;
  // The local device asks the peers to confirm the items that arrive from it.
  bool require_confirmation = 2;
  // Blob store limit in bytes.
  int64 blob_max_size_bytes = 3;
  // Directory that receives shared files.
  string downloads_dir = 4;
  // Policy of an online network without restrictions.
  PolicyRow unmetered = 5;
  // Policy of a network billed by volume.
  PolicyRow metered = 6;
  // Policy of a roaming network.
  PolicyRow roaming = 7;
  // Policy of a network with the system data saver on.
  PolicyRow data_saver = 8;
  // Largest item fetched eagerly over the relay, in bytes.
  int64 relay_max_size_bytes = 9;
}

message GetStatusRequest {}

message GetStatusResponse {
  string version = 1;
  // Device ID in lowercase hex.
  string device_id = 2;
  string device_name = 3;
  bool running = 4;
  NetworkState network = 5;
  // Paired devices with their live connection state.
  repeated Device devices = 6;
  Pause pause = 7;
  FriendsDiscovery friends_discovery = 8;
  // Addresses of the main listener that a peer can reach, host:port.
  repeated string addrs = 9;
}

message WatchEventsRequest {}

message WatchEventsResponse {
  Event event = 1;
}

message ListDevicesRequest {
  bool include_revoked = 1;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RenameDeviceRequest {
  // Device ID in lowercase hex.
  string device_id = 1;
  string name = 2;
}

message RenameDeviceResponse {}

message RevokeDeviceRequest {
  // Device ID in lowercase hex. The ID of this device leaves the group.
  string device_id = 1;
}

message RevokeDeviceResponse {}

message SetDeviceConfirmationRequest {
  // Device ID in lowercase hex. Empty when self is set.
  string device_id = 1;
  bool require = 2;
  // Change the confirmation flag of this device instead of a paired one.
  bool self = 3;
}

message SetDeviceConfirmationResponse {}

message SetPeerAddressRequest {
  // Device ID in lowercase hex.
  string device_id = 1;
  // Address of the device, host:port. An IPv6 host is written in brackets.
  string addr = 2;
}

message SetPeerAddressResponse {
  // The device with its state after the address was stored.
  Device device = 1;
}

message SetFriendsDiscoveryRequest {
  // On turns the search on and extends a running one, off turns it off.
  bool on = 1;
}

message SetFriendsDiscoveryResponse {
  // The search after the change.
  FriendsDiscovery friends_discovery = 1;
}

message OpenPairingWindowRequest {
  Role role = 1;
}

message OpenPairingWindowResponse {
  PairingWindow window = 1;
}

message ExtendPairingWindowRequest {}

message ExtendPairingWindowResponse {
  PairingWindow window = 1;
}

message ClosePairingWindowRequest {}

message ClosePairingWindowResponse {}

message ListPairingCandidatesRequest {}

message ListPairingCandidatesResponse {
  repeated PairingCandidate candidates = 1;
}

message StartSasRequest {
  // Address of the candidate, host:port.
  string addr = 1;
}

message StartSasResponse {}

message ConfirmSasRequest {
  // Device ID in lowercase hex.
  string device_id = 1;
}

message ConfirmSasResponse {}

message RejectSasRequest {
  // Device ID in lowercase hex.
  string device_id = 1;
}

message RejectSasResponse {}

message GetPairingQrRequest {
  // Addresses of this device to put into the code, host:port. A device that
  // cannot list its own interfaces passes the addresses its platform reports.
  repeated string addrs = 1;
}

message GetPairingQrResponse {
  // Code of the open window, absent when no window is open.
  PairingQr qr = 1;
}

message ScanPairingQrRequest {
  // Text of the code.
  string uri = 1;
}

message ScanPairingQrResponse {}

message GetClipRequest {}

message GetClipResponse {
  // Most recent item, absent when the history is empty.
  ClipItem item = 1;
}

message SetClipRequest {
  string text = 1;
}

message SetClipResponse {
  // Item created for the text.
  ClipItem item = 1;
}

// A history entry with the state of its payloads.
message HistoryItem {
  ClipItem item = 1;
  // Every payload of the item is stored on this device.
  bool complete = 2;
}

message ListHistoryRequest {
  // Only items of this kind. KIND_UNSPECIFIED lists every kind.
  Kind kind = 1;
  // Only items captured by this device, lowercase hex. Empty lists every
  // device.
  string device_id = 2;
  // Maximum number of items. Zero uses the default, the server caps it.
  uint32 limit = 3;
}

message ListHistoryResponse {
  repeated HistoryItem items = 1;
}

message GetHistoryItemRequest {
  // UUID of the item.
  string id = 1;
}

message GetHistoryItemResponse {
  HistoryItem item = 1;
}

message DeleteHistoryItemRequest {
  // UUID of the item.
  string id = 1;
}

message DeleteHistoryItemResponse {}

message FetchHistoryItemRequest {
  // UUID of the item.
  string id = 1;
  // Where the payloads are written. Empty downloads them only.
  string path = 2;
}

message FetchHistoryItemResponse {
  HistoryItem item = 1;
  // Paths of the written payloads.
  repeated string files = 2;
}

message CopyHistoryItemRequest {
  // UUID of the item.
  string id = 1;
}

message CopyHistoryItemResponse {}

message ApplyHistoryItemRequest {
  // UUID of the item.
  string id = 1;
}

message ApplyHistoryItemResponse {}

// One file of a transfer.
message TransferFile {
  string name = 1;
  // File size in bytes.
  uint64 size = 2;
  // BLAKE3 hash of the file in lowercase hex.
  string blake3 = 3;
  // File modification time, unix milliseconds.
  int64 mtime_unix_ms = 4;
  string mime_type = 5;
}

// One file transfer with a paired device.
message Transfer {
  string id = 1;
  TransferDirection direction = 2;
  // Device ID of the peer in lowercase hex.
  string device_id = 3;
  string device_name = 4;
  TransferState state = 5;
  repeated TransferFile files = 6;
  // Bytes transferred so far.
  uint64 bytes = 7;
  // Size of all files in bytes.
  uint64 total_bytes = 8;
  // Paths of the saved files of a finished incoming transfer.
  repeated string paths = 9;
  // Failure in plain English.
  string error = 10;
  // Time the transfer started, unix milliseconds.
  int64 created_at_unix_ms = 11;
}

message SendFilesRequest {
  // Absolute paths of the files.
  repeated string paths = 1;
  // Receivers, device IDs in lowercase hex. At least one.
  repeated string device_ids = 2;
}

message SendFilesResponse {
  repeated Transfer transfers = 1;
}

message ListTransfersRequest {}

message ListTransfersResponse {
  repeated Transfer transfers = 1;
}

message CancelTransferRequest {
  // Transfer ID.
  string id = 1;
}

message CancelTransferResponse {}

message AcceptTransferRequest {
  // Transfer ID.
  string id = 1;
}

message AcceptTransferResponse {}

message RejectTransferRequest {
  // Transfer ID.
  string id = 1;
}

message RejectTransferResponse {}

// An incoming file transfer request of a Friends device. Nothing is written to
// the disk until it is accepted.
message ShareRequest {
  // Transfer ID.
  string id = 1;
  // Device ID of the sender in lowercase hex.
  string device_id = 2;
  string device_name = 3;
  repeated TransferFile files = 4;
  // Size of all files in bytes.
  uint64 total_bytes = 5;
  // Time the request arrived, unix milliseconds.
  int64 created_at_unix_ms = 6;
  // Time the request stops waiting for a decision, unix milliseconds.
  int64 expires_at_unix_ms = 7;
}

message ListRequestsRequest {}

message ListRequestsResponse {
  repeated ShareRequest requests = 1;
}

message DecideRequestRequest {
  // Transfer ID.
  string id = 1;
  // Accept the files or decline the request.
  bool accept = 2;
}

message DecideRequestResponse {
  // The request after the decision.
  ShareRequest request = 1;
}

message GetPauseRequest {}

message GetPauseResponse {
  Pause pause = 1;
}

message SetPauseRequest {
  PauseMode mode = 1;
  // Deadline of PAUSE_MODE_UNTIL, unix milliseconds.
  int64 until_unix_ms = 2;
}

message SetPauseResponse {
  Pause pause = 1;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  optional string device_name = 1;
  optional bool require_confirmation = 2;
  optional int64 blob_max_size_bytes = 3;
  optional string downloads_dir = 4;
  // Policy rows to change. A missing row, cell or field keeps the stored
  // value.
  PolicyRow unmetered = 5;
  PolicyRow metered = 6;
  PolicyRow roaming = 7;
  PolicyRow data_saver = 8;
  optional int64 relay_max_size_bytes = 9;
  // Remove the stored policy overrides and return to the defaults. Rows given
  // in the same request are stored on top of the defaults.
  bool reset_policy = 10;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}

// Transport of the connection to the relay.
enum RelayTransport {
  RELAY_TRANSPORT_UNSPECIFIED = 0;
  // No connection.
  RELAY_TRANSPORT_NONE = 1;
  // QUIC over UDP.
  RELAY_TRANSPORT_QUIC = 2;
  // WebSocket over TLS.
  RELAY_TRANSPORT_WSS = 3;
}

// Relay access of the Personal group and the state of the client.
message Relay {
  // Address of the relay, host:port or https://host:port. Empty when the relay
  // is off.
  string url = 1;
  // An access token is stored on this device. The token itself is never
  // returned.
  bool token_set = 2;
  // The client is registered on the relay.
  bool connected = 3;
  RelayTransport transport = 4;
  // Time the settings last changed, unix milliseconds.
  int64 changed_at_unix_ms = 5;
  // Files travel over the relay only when the user asks for them.
  bool files_on_request = 6;
}

message GetRelayRequest {}

message GetRelayResponse {
  Relay relay = 1;
}

message SetRelayRequest {
  // Address of the relay, host:port or https://host:port.
  string url = 1;
  // Access token of the group. The stored token is kept when the field is
  // absent.
  optional string token = 2;
  // Change the rule for files over the relay. The stored rule is kept when the
  // field is absent.
  optional bool files_on_request = 3;
}

message SetRelayResponse {
  Relay relay = 1;
}

message RelayOffRequest {}

message RelayOffResponse {
  Relay relay = 1;
}
