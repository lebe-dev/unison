[package]
name = "unison-desktop"
version = "0.1.0"
description = "Unison desktop application"
edition = "2024"

[lib]
name = "unison_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
# Native drags out of the window. The crate binds AppKit, OLE and GTK from Rust.
drag = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "transport",
] }
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# GTK of the window, which the app already links. The native drag needs the
# window itself.
gtk = "0.18"
# D-Bus of the session: the file manager and the tray host. The crate is pure
# Rust and talks to the bus over a socket.
zbus = "5"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http2"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSResponder",
  "NSSharingService",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSError",
  "NSGeometry",
  "NSString",
  "NSURL",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
