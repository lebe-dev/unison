version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - predeclared
    - revive
    - unconvert
    - unparam
    - wastedassign
  exclusions:
    paths:
      - desktop/node_modules
      - desktop/src-tauri/target
    rules:
      # Tests read temporary files and accept the certificates they generate.
      - path: _test\.go
        linters:
          - gosec
      # vnet is a test double that drops packets with a seeded generator.
      - path: core/transport/vnet/
        linters:
          - gosec
  settings:
    gosec:
      excludes:
        # Conversions are checked next to the parser that reads the bytes.
        - G115

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lebe-dev/unison
