# The relay behind a reverse proxy that terminates TLS: only the WebSocket
# transport is published, on the loopback interface, for the proxy to forward
# /relay to. QUIC stays unpublished, so clients use the WebSocket fallback.
name: unison-relay

services:
  relay:
    image: ${RELAY_IMAGE:?set RELAY_IMAGE to the image to run}
    container_name: unison-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELAY_WS_PORT:-8443}:8443/tcp"
      - "127.0.0.1:${RELAY_HTTP_PORT:-8080}:8080/tcp"
    environment:
      UNISON_RELAY_WS_ADDR: ":8443"
      UNISON_RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
      # The proxy talks TLS to the relay over the loopback interface, so a
      # self-signed certificate is enough.
      UNISON_RELAY_TLS_CERT: /etc/unison-relay/cert.pem
      UNISON_RELAY_TLS_KEY: /etc/unison-relay/key.pem
      UNISON_RELAY_TOKENS_FILE: /etc/unison-relay/tokens.txt
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./secrets:/etc/unison-relay:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
