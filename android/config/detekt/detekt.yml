# Static analysis of the Android Kotlin sources. The rules follow the code of
# the app: a Compose screen is a long function with many parameters, and UI
# dimensions are literals rather than constants.
complexity:
  LongMethod:
    threshold: 200
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 70
    thresholdInObjects: 30
  LargeClass:
    threshold: 1000
naming:
  FunctionNaming:
    # Composables are capitalised by convention.
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    # Screens use literal dimensions, and the updater carries the constants of
    # the GitHub API and of the installation protocol.
    excludes: ['**/test/**', '**/androidTest/**', '**/*.kts', '**/ui/**', '**/updater/**']
  ReturnCount:
    max: 6
